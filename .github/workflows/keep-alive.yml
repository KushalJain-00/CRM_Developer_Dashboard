name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *' # Render sleeps idle instances after 15 min; ping every 10 keeps it live
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # -f makes the job fail on HTTP errors → red X in Actions if the API is down
      - run: curl -fsS --max-time 30 https://crm-developer-dashboard.onrender.com/health
